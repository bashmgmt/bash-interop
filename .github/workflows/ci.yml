name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

# Sibling deps are wildcard versions the dev workspace patches to
# local paths. A standalone clone falls through to crates.io, where
# nothing is published yet - CI stays red until the publish chain
# reaches this crate.

jobs:
  check:
    name: check + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps --document-private-items

  test:
    name: tests (bash 5, shells serialised)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash --version
      - run: cargo test --lib -- --test-threads=1
      - run: cargo test --test proofs -- --test-threads=1
