name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bashmgmt/.github/.github/workflows/rust-ci.yml@main
    with:
      test: |
        cargo test --lib -- --test-threads=1
        cargo test --test proofs -- --test-threads=1
        cargo test --doc
        docs/sync-quotes.bash --check
      bash-versions: '["system", "5.3.9"]'
